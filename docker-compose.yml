version: '3.8'
services:
  postgres-dev:
    image: postgres:15-alpine
    container_name: pz9-postgres-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: pz9
    ports:
      - "5432:5432"
    volumes:
      - pz9_data:/var/lib/postgresql/data

volumes:
  pz9_data: