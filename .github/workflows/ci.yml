name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "pract24" ]
  pull_request:
    branches: [ "main", "master", "pract24" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Show Go version
        run: go version

      - name: Download dependencies
        run: go mod download
        working-directory: ./services/tasks

      - name: Run tests
        run: go test ./...
        working-directory: ./services/tasks

      - name: Build application
        run: go build ./...
        working-directory: ./services/tasks

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          USER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          docker build \
            -t ghcr.io/$USER/techip-tasks:${{ github.sha }} \
            -t ghcr.io/$USER/techip-tasks:latest \
            .
        working-directory: ./services/tasks

      - name: Push Docker image
        run: |
          USER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          docker push ghcr.io/$USER/techip-tasks:${{ github.sha }}
          docker push ghcr.io/$USER/techip-tasks:latest